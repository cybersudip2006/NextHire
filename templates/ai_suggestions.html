{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2 style="text-align: center; color: var(--primary);">AI Resume Suggestions</h2>
    <p style="text-align: center; color: #666; margin-bottom: 2rem;">Paste your resume text below to get concise, actionable improvements.</p>
    
    <form method="POST">
        <div class="form-group">
            <textarea name="resume_text" rows="10" placeholder="Paste your professional summary, experience, or project details here..." required></textarea>
        </div>
        <div style="text-align: center;">
            <button type="submit" class="btn">Get AI Feedback</button>
        </div>
    </form>

    {% if suggestions %}
    <div class="results-card">
        <h3 style="margin-top: 0;">Actionable Insights</h3>
        <div style="white-space: pre-wrap; line-height: 1.8; font-size: 1rem;">
            {% for item in suggestions %}
                {{ item }}<br>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
