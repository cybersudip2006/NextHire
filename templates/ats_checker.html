{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2 style="text-align: center; color: var(--primary);">ATS Score Checker</h2>
    
    <form method="POST" enctype="multipart/form-data" style="text-align: center; padding: 2rem 0;">
        <div class="form-group">
            <label>Upload PDF Resume</label>
            <input type="file" name="resume_pdf" accept=".pdf" required style="max-width: 400px; margin: 0 auto;">
        </div>
        <button type="submit" class="btn">Analyze Resume</button>
    </form>

    {% if results %}
    <div class="results-card">
        <h3 style="color: var(--primary);">Deep AI Analysis</h3>
        <!-- This displays the full AI report directly -->
        <div style="white-space: pre-wrap; line-height: 1.8; font-size: 1rem;">
            {{ results.ai_feedback }}
        </div>
    </div>
    {% endif %}
    
</div>
{% endblock %}
