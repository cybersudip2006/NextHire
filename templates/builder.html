{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2 style="text-align: center; color: var(--primary); margin-top: 0;">Build Your Resume</h2>
    <form method="POST" action="/builder">
        
        <!-- Template Selection Placeholder -->
        <div class="form-group">
            <label>Select Template Style</label>
            <select name="template_style">
                <option value="ats_1">ATS Format - Style 1 (Minimal)</option>
                <option value="ats_2">ATS Format - Style 2 (Modern)</option>
                <option value="modern_1">Modern Format - Style 1 (Two Column)</option>
                <option value="fresher">Fresher / Student Template</option>
                <!-- 20 templates logic will populate here -->
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Full Name (Max 100 char)</label>
                <input type="text" name="name" maxlength="100" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Phone Number</label>
                <div class="phone-input-group">
                    <select id="country_select">
                        <option value="IN">India (+91)</option>
                        <option value="US">USA (+1)</option>
                        <option value="UK">UK (+44)</option>
                    </select>
                    <input type="hidden" name="country_code" id="hidden_country_code" value="+91">
                    <input type="text" name="phone" id="phone_input" maxlength="10" placeholder="Enter 10 digits" required pattern="\d*">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Address (Max 250 char)</label>
            <textarea name="address" maxlength="250" rows="2" required></textarea>
        </div>
        
        <div class="form-group">
            <label>Professional Objective</label>
            <textarea name="objective" rows="3"></textarea>
        </div>

        <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 30px 0;">

        <!-- Education block with Start/End Year -->
        <h3 style="color: var(--primary);">Education</h3>
        <div class="form-group">
            <label>Institution Name</label>
            <input type="text" name="edu_school">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Start Year (Optional)</label>
                <input type="number" name="edu_start" min="1980" max="2030" placeholder="YYYY">
            </div>
            <div class="form-group">
                <label>End Year (Optional)</label>
                <input type="number" name="edu_end" min="1980" max="2030" placeholder="YYYY">
            </div>
        </div>

        <!-- Experience block with Start/End Year -->
        <h3 style="color: var(--primary);">Experience / Internships</h3>
        <div class="form-group">
            <label>Company / Organization Name</label>
            <input type="text" name="exp_company">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Start Year (Optional)</label>
                <input type="number" name="exp_start" min="1980" max="2030" placeholder="YYYY">
            </div>
            <div class="form-group">
                <label>End Year (Optional)</label>
                <input type="number" name="exp_end" min="1980" max="2030" placeholder="YYYY">
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button type="submit" class="btn" style="width: 100%; font-size: 1.1rem;">Generate Resume PDF</button>
        </div>
    </form>
</div>
{% endblock %}
