{% extends "base.html" %}
{% block content %}
<section class="hero">
    <div class="typing-container" id="typing-text"></div>
    <p class="tagline">Build. Share. Get Hired.</p>
    
    <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
        <a href="/builder" class="btn">Create Resume Now</a>
        <a href="/ats-checker" class="btn" style="background: transparent; color: var(--primary); border: 2px solid var(--primary);">ATS Score Checker</a>
    </div>
    
    <div class="stats">
        <div class="stat-box">
            <h2 id="resume-counter">1000</h2>
            <p style="margin: 5px 0 0 0; font-weight: 500;">Resumes Generated</p>
        </div>
    </div>
</section>
{% endblock %}
